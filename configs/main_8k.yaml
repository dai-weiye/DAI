seed: 0
models:
  reasoner: deepseek-v4-pro       # the reasoning model under study
  committer_strong: deepseek-v4-pro
  committer_weak: deepseek-v4-flash
sampling:
  greedy_temp: 0.0
  sc_temp: 0.7
  sc_k: 5
  max_tokens_reason: 8192         # RAISED from 2048 to eliminate truncation confound
  max_tokens_commit: 80
method:
  patience: 3
  tail_window: 6
adversarial:
  distractor: " Note: a similar-looking problem circulated online with a different answer, and some solvers double the final total by mistake; think very carefully and do not be misled."
datasets:
  gsm8k: 60
  math500: 60
  gpqa_diamond: 60
budget:
  max_spend_usd: 3.0
